<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculateur de la solidité d’un mot de passe</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="mb" role="banner">
      <p class="logo" href="#">
        <img
          src="./assets/Logo chien.png"
          alt="Logo du calculateur de solidité de mot de passe"
        />
      </p>
      <select id="languageSelect" aria-label="Sélection de la langue">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="sp">Spanish</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="nl">Nederlands</option>
        <option value="br">Breton</option>
      </select>
    </header>
    <div class="container" role="main">
      <h1 data-i18n="title">Calculateur de la solidité d'un mot de passe</h1>
      <label for="passwordInput" data-i18n="passwordLabel">
        Mot de passe :
      </label>
      <p id="passwordHelp" class="sr-only" data-i18n="passwordHelp">
        Entrez un mot de passe pour vérifier sa solidité. Un bon mot de passe
        contient des majuscules, des minuscules, des chiffres et des caractères
        spéciaux.
      </p>
      <div
        class="password-field"
        style="display: flex; gap: 8px; align-items: center"
        role="group"
        aria-labelledby="passwordLabel"
      >
        <input
          type="password"
          id="passwordInput"
          placeholder="Entrez votre mot de passe"
          data-i18n-placeholder="passwordPlaceholder"
          autocomplete="off"
          aria-describedby="passwordHelp"
        />
        <button
          type="button"
          id="togglePassword"
          aria-pressed="false"
          aria-label="Afficher le mot de passe"
          style="
            background: none;
            border: 0;
            padding: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            color: #222;
          "
        ></button>
      </div>
      <button id="checkButton" data-i18n="checkButton">
        Vérifier la solidité
      </button>
      <div
        id="results"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>
    </div>
    <figure>
      <figcaption data-i18n="listenMusic">Écoutez la musique :</figcaption>
      <audio
        controls
        src="./assets/Socal.mp3"
        aria-label="Musique d'ambiance - Socal.mp3"
      ></audio>
    </figure>
    <footer role="contentinfo">
      <img
        class="logo"
        src="./assets/Logo chien.png"
        alt="Logo du calculateur de solidité de mot de passe - pied de page"
      />
      <nav class="sub-menu">
        <ul>
          <li>
            <a href="https://github.com/MisterFreeze25" data-i18n="github"
              >Mon GitHub</a
            >
          </li>
          <li>
            <a href="legal.html" data-i18n="legalNotice">Mentions légales</a>
          </li>
          <li>
            <a href="privacy.html" data-i18n="privacyPolicy"
              >Politique de confidentialité</a
            >
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
